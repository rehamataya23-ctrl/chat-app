<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chat App</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background-color: #efeae2;
background-image:
  radial-gradient(circle at 20% 20%, rgba(0,0,0,.035) 0 2px, transparent 3px),
  radial-gradient(circle at 80% 70%, rgba(0,0,0,.03) 0 2px, transparent 3px),
  radial-gradient(circle at 40% 85%, rgba(0,0,0,.025) 0 1.5px, transparent 2.5px);
background-size: 80px 80px, 100px 100px, 60px 60px;
    }
    .app {
      max-width: 500px;
      margin: auto;
      height: 100vh;
      background: white;
      display: flex;
      flex-direction: column;
    }
    .header {
      padding: 18px;
      background: #222;
      color: white;
      font-size: 20px;
      font-weight: bold;
    }
    .messages {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
    }
    .message {
      width: fit-content;
      max-width: 80%;
      padding: 12px 16px;
      margin: 10px 0;
      border-radius: 18px;
      background: #e9e9e9;
    }
    .mine {
      margin-right: auto;
      background: #222;
      color: white;
    }
    .input {
      display: flex;
      padding: 12px;
      border-top: 1px solid #ddd;
      gap: 8px;
    }
    input {
      flex: 1;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: 20px;
      font-size: 16px;
    }
    button {
      border: 0;
      border-radius: 20px;
      padding: 0 18px;
      background: #222;
      color: white;
    }
  </style>
</head>

<body>
  <div class="app">
    <div class="header">محادثة</div>

    <div class="messages" id="messages">
      <div class="message">مرحبا 👋</div>
      <div class="message mine">أهلا!</div>
    </div>

    <div class="input">
      <input id="text" placeholder="اكتب رسالة...">
      <button onclick="sendMessage()">إرسال</button>
    </div>
  </div>

  <script>
    function sendMessage() {
      const input = document.getElementById("text");
      const text = input.value.trim();

      if (!text) return;

      const msg = document.createElement("div");
      msg.className = "message mine";
      msg.textContent = text;

      document.getElementById("messages").appendChild(msg);
      input.value = "";
    }
  </script>
</body>
</html>
